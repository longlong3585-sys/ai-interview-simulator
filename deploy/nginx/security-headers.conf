# 安全响应头 · 片段（被各个 location 显式 include）
#
# ⚠️ 为什么要做成片段、并在**每个** location 里 include：
#    nginx 的 `add_header` 有一条反直觉规则 ——
#    **子级 location 只要写了任何一条 `add_header`，父级/server 级的
#    `add_header` 就全部失效**（不是叠加，是替换）。
#
#    直觉上会以为"在 server 块里写一遍就全站生效"，实际是：
#      · `location /` 里写了 `Cache-Control: no-store` ⇒ CSP / HSTS /
#        nosniff / X-Frame-Options **全部消失**；
#      · `location /assets/` 里写了 `Cache-Control: immutable` ⇒ 同上；
#      · 最讽刺的是错误页（4xx/5xx）往往恰好落在带 `add_header` 的 location 里，
#        于是最需要 `nosniff` 的地方反而没有。
#    这类问题在浏览器里几乎看不出来（页面照常打开），只有安全扫描或
#    真正被 iframe 嵌套时才暴露，所以必须靠"显式 include"而非"靠继承"。
#
#    安装到：/etc/nginx/snippets/security-headers.conf
#
# `always` 参数很关键：它让这些头在 4xx/5xx 响应上也发送，否则错误页没有它们。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options        "SAMEORIGIN" always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

# CSP：前端只用同源接口；样式需要 `unsafe-inline`（Vite 会把首屏样式内联，
# 运行时也有内联 style）；图片允许 data:/blob:（验证码与头像预览）。
# ⚠️ 将来接入第三方脚本/字体/统计，必须同步放开对应来源，否则页面会白屏。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
