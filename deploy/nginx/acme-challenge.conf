# ACME（Let's Encrypt）校验用目录 · 80 端口专用片段
#
# 由 `deploy/nginx/ai-interview.conf` 通过 `include` 引入。
# 放在 http 块的 server 里，让 certbot 的 webroot 插件能在
# `http://你的域名/.well-known/acme-challenge/<token>` 上取到校验文件。
#
# ⚠️ 三条容易踩的坑：
#   1. certbot 的 **nginx 插件**会往站点配置里塞它自己的一段
#      `location /.well-known/acme-challenge/ {...}`。若这里也写了，
#      两边会打架（前者可能被后者的正则抢走 → 校验 404）。
#      本 Runbook 一律用 **webroot** 方式签发（`certbot certonly --webroot`），
#      所以这段是必需的、且不会有冲突。
#   2. 目录必须预先建好并让 nginx 可读：`mkdir -p /var/www/certbot`。
#      不存在时 nginx 仍能启动，但校验会 404 —— 报错信息只有
#      "Invalid response ... 404"，很难联想到是目录没建。
#   3. `default_type` 不是必须的，但显式写出来便于排障时确认响应类型。
location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    root /var/www/certbot;
    access_log off;
}
