# 入口 HTML 的缓存策略 · 片段
#
# `index.html` **绝不能长缓存**：它是唯一"内容不变但必须每次检查"的文件。
# Vite 产物是 `assets/index-<hash>.js`，HTML 里引用的是带 hash 的路径 ——
# 一旦 HTML 被缓存住，用户刷新也只会拿到指向**旧 hash** 的页面，
# 典型症状是"发了新版，用户还在跑旧版，报错信息对不上代码"。
#
# 为什么不用 `add_header Cache-Control`：静态文件的响应头由 `expires`/`etag`
# 模块产生，混写容易互相覆盖；`no-store` 语义最直接。
#
# ⚠️ 每条 `add_header` 都会**屏蔽父级**的同名指令族（见 security-headers.conf
#    顶部的说明），因此本片段必须与 security-headers.conf 成对 include。
#
# 安装到：/etc/nginx/snippets/html-no-cache.conf

add_header Cache-Control "no-store" always;
