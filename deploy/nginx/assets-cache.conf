# 带内容哈希的静态产物 · 缓存策略片段
#
# Vite 产物形如 `assets/index-B616GuUq.js`：**内容一变文件名就变**，
# 因此同名文件的字节永远相同 —— 可以放心 `immutable` 长缓存一年。
# 这是本项目唯一"缓存越狠越好"的一类资源。
#
# ⚠️ 必须与 security-headers.conf 成对 include：`add_header` 不叠加，
#    只写这一条会把父级的 CSP/nosniff 等全部顶掉（详见该文件顶部说明）。
#
# 安装到：/etc/nginx/snippets/assets-cache.conf

expires 1y;
add_header Cache-Control "public, immutable" always;
