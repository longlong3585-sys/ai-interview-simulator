# AI 面试模拟系统 · Nginx 站点配置（HTTP · **部署临时态**）
#
# 这个文件是 T-53 的**第一步**：先把 80 端口跑通（前端能打开、接口能通、
# ACME 校验目录就位），然后才让 certbot 签发证书。
#
# ⚠️ 启用 HTTPS 之后，**本文件要被 `ai-interview-ssl.conf` 取代**（不是并存）：
#    最终形态是唯一一个 HTTPS server 块 + 一个只做 301 的 80 端口块，
#    而 `ai-interview-ssl.conf` 里已经把这两块都写好了。
#    两份配置同时启用会有两个 `server_name` 相同的 80 端口 server 块 ——
#    nginx 不会报错，但哪个生效取决于加载顺序，属于"看起来能跑、其实随机"的
#    配置，必须避免。
#
# 安装位置：/etc/nginx/sites-available/ai-interview
# 启用：    ln -sf /etc/nginx/sites-available/ai-interview /etc/nginx/sites-enabled/
#
# 本文件与 ssl 版**共用同一个 upstream**。两份配置互斥启用，因此不算重复定义；
# 但也正因为互斥，任何 proxy/缓存策略的改动都要**同时改两个文件**
# （Runbook 里有一句提醒）。
#
# 部署前替换占位符（Runbook 第 6 步会逐条给命令）：
#     YOUR_DOMAIN  -> 你的域名或公网 IP（本机是 112.124.54.223）
#     APP_DIR      -> 项目根目录（本机是 /root/ai-interview-simulator）

upstream ai_interview_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # 站点根 = 前端构建产物。**必须是 dist 目录本身**（不是它的父目录）
    root APP_DIR/frontend/dist;
    index index.html;

    server_tokens off;      # 不把 nginx 版本号写进响应头

    # ---------------------------------------------------------------------
    # 上传体积：**必须大于应用自己的限制**，否则验收标准做不到
    # ---------------------------------------------------------------------
    # T-53 验收标准："上传 >5MB 简历返回 400（**不是 413**）"。
    # 应用在 routers/interview.py 判 `MAX_FILE_SIZE = 5MB` → 400；
    # Nginx 默认 client_max_body_size 只有 1m，会在应用之前把请求掐掉返回 413，
    # 那条业务提示就永远到不了用户面前。
    # 设 8m：5MB 的边界值能进到应用（应用回 400），真正的超大请求仍被挡在门外。
    client_max_body_size 8m;
    client_body_buffer_size 1m;

    access_log /var/log/nginx/ai-interview.access.log;
    error_log  /var/log/nginx/ai-interview.error.log warn;

    # =====================================================================
    # 0) ACME 校验目录（certbot --webroot）
    # =====================================================================
    # `^~` 前缀匹配的优先级高于正则与普通前缀，因此即使将来 `location /`
    # 改成 `return 301 https://...`，续期请求也**不会**被跳转打偏 ——
    # 这是"证书 90 天后突然过期"的头号原因，务必保留。
    include /etc/nginx/snippets/acme-challenge.conf;

    # =====================================================================
    # 1) 接口反代
    # =====================================================================
    # ⚠️ `location /api` 同时匹配 `/api` 与 `/api/xxx`，且**不剥前缀**；
    #    `proxy_pass` 后面不带 URI（没有结尾的 `/`）也不改写路径 —— 两者都对得上
    #    FastAPI 里 `APIRouter(prefix="/api")` 的路由。
    #    （写成 `proxy_pass http://.../;` 会把 `/api` 吃掉，全线 404。）
    location /api {
        proxy_pass http://ai_interview_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;

        # ⚠️ 后端靠 X-Forwarded-For **最右**一段取真实 IP（T-21，
        #    `TRUSTED_PROXY_COUNT` 默认 1）。`$proxy_add_x_forwarded_for`
        #    把客户端伪造的值留在左边、把真实 IP 追加到最右，后端只信最右，
        #    所以伪造无效。**不要**改成 `$remote_addr`（丢掉代理链），
        #    也**不要**信 `$http_x_forwarded_for`（那才是可伪造的原始头）。
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 面试会话与 AI 调用可能较慢；默认 60s 读超时对 AI 生成偏紧
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 流式响应（报告导出等）不要被 Nginx 攒着，否则前端看起来"卡住"
        proxy_buffering off;
        proxy_intercept_errors off;
    }

    # =====================================================================
    # 2) 用户上传物（头像等）
    # =====================================================================
    # 后端自己挂载了 `app.mount("/uploads", StaticFiles(directory="uploads"))`
    # （main.py:51），所以这里**反代**而不是 `alias` 直接读盘：
    #   * 只有一条路径规则，不会出现"Nginx 读的目录"与"应用写的目录"不一致
    #     （后端用相对路径 `uploads/avatars`，全看 uvicorn 的 cwd）；
    #   * 将来上传物搬到对象存储或换目录结构，只改应用、不碰 Nginx。
    # 代价：静态文件读写走后端进程。本项目头像 ≤2MB、QPS 极低，这点代价
    # 换"路径口径唯一"是划算的。
    #
    # ⚠️ 必须写成 `location ^~ /uploads/`（带 `^~`）。写成普通前缀
    #    `location /uploads/` 时，头像 URL `/uploads/avatars/user_1_ab.jpg`
    #    会**先命中下面那条静态文件正则**（nginx 规则：正则优先于普通前缀），
    #    于是 nginx 去 `root` 指向的 dist 目录里找这个 jpg —— 找不到就 404，
    #    而且报错只说"文件不存在"，看起来像后端没存上，极难排查。
    #    这条是被 `tests/test_nginx_config.py::test_uploads_subpath_...` 抓出来的。
    location ^~ /uploads/ {
        proxy_pass http://ai_interview_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 头像文件名内含随机 hex（user_1_<32位>.jpg），内容不会原地变化；
        # 换头像会换文件名，因此不存在"缓存住旧头像"的问题。
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # =====================================================================
    # 3) 缓存头：带 hash 的静态资源 vs 入口 HTML
    # =====================================================================
    # ⚠️ 每个 location 都必须**显式** include 安全头：nginx 的 `add_header`
    #    子级一写就把父级整族顶掉（不叠加）。详见 security-headers.conf 顶部。
    location /assets/ {
        try_files $uri =404;
        access_log off;
        include /etc/nginx/snippets/assets-cache.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # favicon / icons.svg 这类根级静态文件：短缓存
    location ~* \.(?:svg|ico|png|jpg|jpeg|gif|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # =====================================================================
    # 4) SPA History 回退（`/admin` 刷新不能 404）
    # =====================================================================
    # main.tsx 用的是 `BrowserRouter` ⇒ 用户在 `/admin` 上按 F5，浏览器会
    # **真的去请求 /admin 这个路径**。没有回退就是 404（而 `npm run dev`
    # 下 Vite 自带回退，所以这个问题只在部署后才暴露）。
    #
    # ⚠️ 必须用 `try_files ... /index.html`（内部重写，返回 **200**），
    #    **不能**用 `return 301 /` 或 `rewrite ... redirect` ——
    #    那样地址栏会跳走，`/admin` 永远进不去。
    #
    # `location = /admin` 精确匹配 + `location ^~ /admin/` 覆盖子路由：
    # 目前前端只有 `/admin` 一条路由（main.tsx:35），但 `/admin/xxx` 这种
    # 子路由写进代码后无需再改 Nginx —— `^~` 保证它不被下面的正则抢走。
    location = /admin {
        try_files /index.html =404;
        include /etc/nginx/snippets/html-no-cache.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /admin/ {
        try_files /index.html =404;
        include /etc/nginx/snippets/html-no-cache.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # =====================================================================
    # 5) 其余请求：先找真实文件，找不到交给 SPA（`*` 兜底回首页）
    # =====================================================================
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/html-no-cache.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 隐藏文件一律拒绝（.env / .git 绝不能被下载）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
