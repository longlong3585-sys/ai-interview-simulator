# AI 面试模拟系统 · Nginx 站点配置（HTTPS · **最终形态**）
#
# ⚠️ **在 certbot 签发成功之前不要启用本文件**。
#    正确顺序：`ai-interview.conf`（HTTP 跑通）→ certbot 签发 → 换成本文件。
#    反过来做，certbot 的 HTTP-01 校验会因为 80 端口不存在而失败。
#
# 与 `ai-interview.conf` 的关系：**互斥**（同一时刻只启用一个）。
# 本文件是最终形态，含两个 server 块：
#   ① 443 业务站点（前端 dist + /api + /uploads + SPA 回退 + 安全头）
#   ② 80 端口只做两件事：ACME 续期校验 + 301 跳 HTTPS
#
# ⚠️ 任何代理头 / 缓存策略的改动都要**两个文件同时改**：
#    它们互斥启用，改漏一个会在"回滚到 HTTP"或"切到 HTTPS"时行为不一致。
#
# 安装位置：/etc/nginx/sites-available/ai-interview-ssl
# 启用：    rm -f /etc/nginx/sites-enabled/ai-interview
#           ln -sf /etc/nginx/sites-available/ai-interview-ssl /etc/nginx/sites-enabled/
#
# 部署前替换占位符（Runbook 第 7 步逐条给命令）：
#     YOUR_DOMAIN  -> 你的域名（**必须是域名**：Let's Encrypt 不给纯 IP 签证书）
#     APP_DIR      -> 项目根目录（本机是 /root/ai-interview-simulator）

upstream ai_interview_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# =========================================================================
# ① 443 业务站点
# =========================================================================
server {
    # Ubuntu 22.04 自带 nginx 是 1.18.0，支持 `listen 443 ssl http2`；
    # nginx ≥ 1.25.1 则要改成 `listen 443 ssl;` + 单独一行 `http2 on;`。
    # 预检会打印 `nginx -v`，Runbook 第 0 步给了判断方法。
    # 这里用不写 http2 参数的写法：**任何版本都能启动**，
    # 代价只是没有 HTTP/2（后续按 Runbook 的"可选优化"再打开）。
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_DOMAIN;

    root APP_DIR/frontend/dist;
    index index.html;
    server_tokens off;

    # ---------------------------------------------------------------------
    # 证书（certbot 的 live 目录里是指向 archive/ 的符号链接，可以放心引用；
    #       续期时符号链接会原子替换，不需要改配置、不需要 reload nginx）
    # ---------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # ---------------------------------------------------------------------
    # TLS 参数（Mozilla "intermediate" 档口径）
    # ---------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    # 关掉 session ticket：它不具备前向保密（nginx 文档明确建议关）
    ssl_session_tickets off;

    # OCSP stapling：证书没有 OCSP 地址时 nginx 会忽略这几行，不会启动失败
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 223.5.5.5 119.29.29.29 valid=300s;   # 阿里云/腾讯公共 DNS
    resolver_timeout 5s;

    # ---------------------------------------------------------------------
    # HSTS：**别一上来就写 1 年，更别加 preload**。
    # 浏览器一旦记住 HSTS，证书出问题期间站点会彻底打不开（连"继续访问"
    # 都没有）。先用 30 天观察一轮 certbot 自动续期，确认正常后再逐步加到
    # 31536000。本项目是**旧站平滑升级**，若还有 http 老用户/书签，
    # 开启前请确认 80→443 跳转已全量生效。
    # ---------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=2592000" always;

    client_max_body_size 8m;      # >5MB 必须由应用返回 400，见 HTTP 配置里的说明
    client_body_buffer_size 1m;

    access_log /var/log/nginx/ai-interview.access.log;
    error_log  /var/log/nginx/ai-interview.error.log warn;

    # ACME 续期校验（certbot 走 80，这里只是兜底；`^~` 保证优先级最高）
    include /etc/nginx/snippets/acme-challenge.conf;

    # ---------------- 接口反代 ----------------
    location /api {
        proxy_pass http://ai_interview_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # ⚠️ HTTPS 下这一行尤其重要：应用若按它判断"是否安全上下文"，
        #    写错会让重定向/安全 Cookie 行为异常。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
        proxy_intercept_errors off;
    }

    # ⚠️ 与 HTTP 版一致，必须用 `^~`：否则头像 URL 会被静态文件正则抢走
    #    （正则优先于普通前缀）→ nginx 去 dist 里找 jpg → 404。
    location ^~ /uploads/ {
        proxy_pass http://ai_interview_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        include /etc/nginx/snippets/assets-cache.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.(?:svg|ico|png|jpg|jpeg|gif|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA History 回退：`/admin` 刷新必须 200（不是 301、不是 404）
    location = /admin {
        try_files /index.html =404;
        include /etc/nginx/snippets/html-no-cache.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /admin/ {
        try_files /index.html =404;
        include /etc/nginx/snippets/html-no-cache.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/html-no-cache.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# =========================================================================
# ② 80 端口：只做 ACME 续期 + 301 跳 HTTPS
# =========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    server_tokens off;

    # ⚠️ 顺序与优先级都要保证：续期请求不能被 301 吃掉。
    #    `^~` 前缀匹配优先级高于 `location /`，因此下面的 301 不影响它。
    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}
