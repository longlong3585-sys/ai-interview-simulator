[pytest]
# T-02 建立的前向兼容配置。
# 当前环境 PyPI 不可达，pytest 尚未安装；测试以 stdlib unittest 运行：
#     cd backend
#     python -m unittest discover -s tests -t . -v
# 一旦 pytest 可安装，本配置即可直接生效，无需改动测试代码。

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 让 `import database` / `import tests` 正常工作
rootdir = .
